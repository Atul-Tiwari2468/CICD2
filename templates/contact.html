{% extends 'base.html' %}
{% block title %}Contact — Atul{% endblock %}
{% block content %}
<section class="contact shell"><div class="contact-copy"><p class="eyebrow">Contact / 03</p><h1>Let’s make the next thing <em>count.</em></h1><p>Have a project, question, or interesting idea? Leave a note and I’ll be glad to hear from you.</p><div class="availability"><svg aria-hidden="true"><use href="#check"></use></svg><span>Open to new conversations</span></div></div><form class="contact-form card" data-contact-form novalidate><div class="form-row"><label for="name">Your name<input id="name" name="name" autocomplete="name" required></label><label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" required></label></div><label for="subject">What’s on your mind?<input id="subject" name="subject" required></label><label for="message">A few details<textarea id="message" name="message" rows="5" required></textarea></label><button class="button button-accent" type="submit">Send inquiry <svg aria-hidden="true"><use href="#arrow-right"></use></svg></button><p class="form-status" role="status" aria-live="polite"></p></form></section>
{% endblock %}
